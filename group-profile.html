<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="20261028-1624-cb436607">
<title>505/506 DLF South Court</title>
<style>
  /* The page the TV opens on GitHub Pages: a few KB, so it arrives even when GitHub is slow from
     the office (2026-10-27: 1-10 KB/s from GitHub Pages, 1.3 MB/s from jsDelivr). It draws the
     closed house at once, then loads the film's code, fonts, images and data from jsDelivr's mirror
     of this repo, pinned to the commit that holds them; if the mirror fails, from this site.
     Built by apps/build_player.py (the cdn variant); published by tools/publish_pages.py. */
  :root { --paper: #F4F1EA; --ink: #1A1714; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--paper); cursor: none; }
  .viewport { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; background: var(--paper); }
  .frame { position: relative; flex: none; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
  .base { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; }
  .frame > .stage { z-index: 2; }
  .frame > .dress { z-index: 3; }
</style>
</head>
<body>
<div class="viewport"><div class="frame" id="frame"><div class="base" id="base"><div class="house" style="position:absolute;top:0;right:0;bottom:0;left:0"><div style="position:absolute;left:808px;top:314px;width:304px;height:6px;background:var(--ink)"></div><div style="position:absolute;left:808px;top:760px;width:304px;height:6px;background:var(--ink)"></div><div style="position:absolute;left:838px;top:340px;width:40px;height:400px;background:#003366"></div><div style="position:absolute;left:906px;top:340px;width:40px;height:400px;background:#181818"></div><div style="position:absolute;left:974px;top:340px;width:40px;height:400px;background:#AA6847"></div><div style="position:absolute;left:1042px;top:340px;width:40px;height:400px;background:#5A0A2D"></div></div></div></div></div>
<script>
(function () {
  const frame = document.getElementById('frame');
  const fit = () => { frame.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  fit();
  addEventListener('resize', fit);

  const BASES = ['https://cdn.jsdelivr.net/gh/garg94sahil/southcourt@8b97f6c94f6a8a145653ca6653184bd9db0d2882/', ''];
  const FILES = {"css": "assets/film/film.7ec60b868139.css", "film": "assets/film/film.fff472cc97fd.json", "scripts": ["assets/film/logo-data.fbb8f96448c7.js", "assets/film/kit.c17818585717.js", "assets/film/family-kit.7d50422c330a.js", "assets/film/film-scenes.385ae5a006fe.js", "assets/film/player.231c3e72b8d9.js"], "festivals": "assets/film/festivals.f6cd48a24923.json"};
  let base = null; // the source that answered first; images follow it

  async function get(path, json) {
    for (const b of BASES) {
      const ctl = typeof AbortController === 'function' ? new AbortController() : null; // Chrome 66+
      const timer = ctl ? setTimeout(() => ctl.abort(), b ? 30000 : 900000) : 0;
      try {
        const r = await fetch(b + path, ctl ? { signal: ctl.signal } : {});
        if (r.ok) {
          const body = json ? await r.json() : await r.text();
          if (base === null) base = b;
          return body;
        }
      } catch (e) { /* try the next source */ } finally { clearTimeout(timer); }
    }
    throw new Error('could not load ' + path);
  }
  const rebase = (node) => JSON.parse(JSON.stringify(node), (k, v) => (k === 'src' && typeof v === 'string' && v.startsWith('assets/') ? base + v : v));
  const run = (code) => { const s = document.createElement('script'); s.textContent = code; document.body.append(s); };

  // In order: fonts, the film, its code (the film starts as soon as the player runs), the festivals.
  // A step that fails is retried a minute later; the house stays on screen meanwhile.
  const steps = [
    async () => { const css = await get(FILES.css); const st = document.createElement('style'); st.textContent = css.split('__BASE__').join(base + 'assets/film/'); document.head.append(st); },
    async () => { window.FILM = rebase(await get(FILES.film, true)); },
    ...FILES.scripts.map((f) => async () => run(await get(f))),
    async () => { window.FILM_WISHES = rebase(await get(FILES.festivals, true)); },
  ];
  let done = 0;
  (async function boot() {
    try { for (; done < steps.length; done++) await steps[done](); } catch (e) { setTimeout(boot, 60000); }
  })();
})();
</script>
</body>
</html>
